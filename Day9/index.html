<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top Anime</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <!-- hero banner -->
        <article class="hero-banner">
            <h1>Discover the Top Anime List</h1>
            <p>Explore the Top 25 Anime list by popularity by JIKAN.api</p>
        </article>
        <!-- tabel programming languange -->
        <article class="table-content">
            <h2>Top 25 Popular Anime</h2>
            <table>
                <thead>
                    <tr>
                        <th>Ranking</th>
                        <th>Anime</th>
                    </tr>
                </thead>
                <tbody id="top-table-row">

                </tbody>
            </table>
        </article>
        <!-- chart programming language -->
        <article>
            <h2>Top 5 Anime Chart</h2>
            <canvas id="animeChart"></canvas>
        </article>
    </main>
    <footer>
        Created by Reza Zuliansyah
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>

</html>
